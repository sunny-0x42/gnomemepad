# Gnomi.fun — React (Vite) UI + serverless API → Gno Pearl (pearl-1)
#
# Auto-deploy: GitHub Actions (.github/workflows/netlify-deploy.yml) on push to master.
# Manual:
#   npm run build --prefix web/ui
#   npx netlify-cli deploy --prod
#
# Env (Netlify Dashboard or below):
#   RPC_URL, CHAIN_ID, PKG, HUB, PROFILE, META, POINTS, BOND, SIGNER_ADDR
# Sapphire fallback: web/.env.sapphire.example

[build]
  command = "npm run build --prefix web/ui"
  publish = "web/ui/dist"
  functions = "web/netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  RPC_URL = "https://rpc.pearl.testnets.gno.land:443"
  CHAIN_ID = "pearl-1"
  PKG = "gno.land/r/g1mv0052e7r6s09f5t9xsqf00nj3tqsgt9dg52jr/gnomemepad/padv23"
  HUB = "gno.land/r/g1mv0052e7r6s09f5t9xsqf00nj3tqsgt9dg52jr/gnomemepad/hubv2"
  PROFILE = "gno.land/r/g1mv0052e7r6s09f5t9xsqf00nj3tqsgt9dg52jr/gnomemepad/profile"
  META = "gno.land/r/g1mv0052e7r6s09f5t9xsqf00nj3tqsgt9dg52jr/gnomemepad/meta"
  POINTS = "gno.land/r/g1mv0052e7r6s09f5t9xsqf00nj3tqsgt9dg52jr/gnomemepad/pointsv2"
  BOND = "gno.land/r/g1mv0052e7r6s09f5t9xsqf00nj3tqsgt9dg52jr/gnomemepad/bond"
  SIGNER_ADDR = "g1mv0052e7r6s09f5t9xsqf00nj3tqsgt9dg52jr"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
