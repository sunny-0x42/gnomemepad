# Register one token logo when asked. No schedule, so it does not open PRs by itself.
#
# Required secrets:
#   TOKEN_RESOURCE_GITHUB_TOKEN  — PAT (repo) that can push to FORK + open PR upstream
#   TOKEN_RESOURCE_FORK          — e.g. sunny-0x42/gno-token-resource
# Optional vars:
#   API_BASE — default https://gnomemepad-sapphire.netlify.app

name: Sync token-resource (Gnoswap logos)

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: "Symbol to register, for example GNOMI"
        required: true
        type: string
      dry_run:
        description: "Dry run (list missing only, no PR)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync missing tokens → gno-token-resource PR
        env:
          API_BASE: ${{ vars.API_BASE }}
          TOKEN_RESOURCE_GITHUB_TOKEN: ${{ secrets.TOKEN_RESOURCE_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.TOKEN_RESOURCE_GITHUB_TOKEN }}
          TOKEN_RESOURCE_FORK: ${{ secrets.TOKEN_RESOURCE_FORK }}
          TOKEN_RESOURCE_UPSTREAM: onbloc/gno-token-resource
          TOKEN_SYMBOL: ${{ github.event.inputs.symbol }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          export API_BASE="${API_BASE:-https://gnomemepad-sapphire.netlify.app}"
          if [ -z "${TOKEN_SYMBOL}" ]; then
            echo "No symbol given. Nothing registered."
            exit 0
          fi
          if [ -z "${TOKEN_RESOURCE_GITHUB_TOKEN}" ] || [ -z "${TOKEN_RESOURCE_FORK}" ]; then
            echo "Missing TOKEN_RESOURCE_GITHUB_TOKEN or TOKEN_RESOURCE_FORK secrets."
            echo "Add them under repo Settings → Secrets, then re-run."
            exit 1
          fi
          node scripts/sync-token-resource.mjs
