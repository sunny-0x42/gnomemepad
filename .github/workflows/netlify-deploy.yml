# Deploy UI + serverless API to Netlify on every push to master
# (and on PRs as draft previews).
#
# Secrets (repo Settings → Secrets and variables → Actions):
#   NETLIFY_AUTH_TOKEN  — Netlify personal access token
#   NETLIFY_SITE_ID     — site id (gnomemepad-sapphire / gnomi.fun)

name: Deploy Netlify

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "netlify.toml"
      - "package.json"
      - ".github/workflows/netlify-deploy.yml"
  pull_request:
    branches: [master]
    paths:
      - "web/**"
      - "netlify.toml"
      - "package.json"
      - ".github/workflows/netlify-deploy.yml"
  workflow_dispatch:

concurrency:
  group: netlify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/ui/package-lock.json

      - name: Install UI deps
        run: npm ci --prefix web/ui

      - name: Build UI
        run: npm run build --prefix web/ui

      - name: Install Netlify CLI
        run: npm install -g netlify-cli

      - name: Deploy to Netlify (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          netlify deploy --prod \
            --dir=web/ui/dist \
            --functions=web/netlify/functions \
            --message "Actions ${{ github.sha }}"

      - name: Deploy to Netlify (draft preview)
        if: github.event_name != 'push' || github.ref != 'refs/heads/master'
        id: preview
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          set -e
          OUT=$(netlify deploy \
            --dir=web/ui/dist \
            --functions=web/netlify/functions \
            --message "PR preview ${{ github.sha }}" \
            --json)
          echo "$OUT"
          URL=$(echo "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const j=JSON.parse(s);console.log(j.deploy_url||j.url||'')})")
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request' && steps.preview.outputs.url
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.url }}';
            const body = `🚀 Netlify draft preview: ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prev = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('🚀 Netlify draft preview:'));
            if (prev) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prev.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
